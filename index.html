<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bizim Albüm</title>
<style>
:root{--bg:#fff7f8;--card:#fff;--tx:#2b2226;--mu:#8a7a80;--ac:#e0566f;--on:#fff;--bd:#f0dfe3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1316;--card:#261c20;--tx:#f6e9ec;--mu:#a99499;--ac:#f0728a;--on:#1a1316;--bd:#3a2b30;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1316;--card:#261c20;--tx:#f6e9ec;--mu:#a99499;--ac:#f0728a;--on:#1a1316;--bd:#3a2b30;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
[hidden]{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
h1{margin:0 0 4px;font-size:26px}
.mu{color:var(--mu);font-size:14px}
input{width:100%;padding:12px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:11px 16px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--mu);border:1px solid var(--bd)}
button:disabled{opacity:.5}
#gate{min-height:80vh;display:flex;align-items:center;justify-content:center}
#gate .card{width:100%;max-width:380px;text-align:center}
#msg{color:var(--ac);min-height:22px;font-size:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:140px}
h2{font-size:15px;color:var(--mu);margin:22px 0 8px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:pointer;display:block;background:var(--bd)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;overflow:auto}
#lb .in{max-width:520px;width:100%;text-align:center;color:#fff}
#lb img{max-width:100%;max-height:60vh;border-radius:12px}
#lb input{background:#fff2;color:#fff;border-color:#fff3}
</style>
</head>
<body>
<div id="gate"><div class="card">
<h1>💕 Bizim Albüm</h1>
<p class="mu">Oda adını ve şifreni yaz. Oda yoksa yeni oluşturulur.</p>
<input id="rn" placeholder="Oda adı" autocomplete="off">
<input id="rp" type="password" placeholder="Şifre">
<div id="msg"></div>
<button id="go" style="width:100%">Odaya gir</button>
</div></div>

<div id="app" class="wrap" hidden>
<header><div><h1 id="title"></h1><div class="mu" id="count"></div></div><button class="ghost" id="out">Çıkış</button></header>
<div class="card" id="up">
<div class="row"><input id="dt" type="date"><input id="cp" placeholder="Not (isteğe bağlı)"></div>
<div class="row" style="margin-top:8px"><button id="pick">📷 Fotoğraf ekle</button><span class="mu" id="st" style="align-self:center"></span></div>
<input id="fi" type="file" accept="image/*" multiple hidden>
</div>
<div id="list"></div>
</div>

<div id="lb" hidden><div class="in">
<img id="lbi" alt="">
<p id="lbc"></p>
<input id="lbd" type="date">
<div class="row" style="justify-content:center;margin-top:8px">
<button id="lbs">Tarihi kaydet</button><button class="ghost" id="lbx" style="color:#ff9aa8">Sil</button><button class="ghost" id="lbk" style="color:#fff">Kapat</button>
</div></div></div>

<script>
const $=s=>document.querySelector(s);
let db,assets,user,roomId,unsub,photos=[],cur=null;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const slug=n=>n.trim().toLowerCase().replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"oda";
const sha=async(p,s)=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s+":"+p)))].map(x=>x.toString(16).padStart(2,"0")).join("");
const msg=t=>$("#msg").textContent=t;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const url=p=>"/_blob/"+p.aid;

async function init(){
  try{[db,assets,user]=await Promise.all([claude.use("db"),claude.use("assets"),claude.use("user")])}catch(e){}
  if(!db){msg("Albüm için claude.ai hesabınla giriş yapıp sayfayı açman gerekiyor.");$("#go").disabled=true;return}
  const saved=JSON.parse(ls.get("album-room")||"null");
  if(saved){try{const s=await db.doc("rooms/"+saved.id).get();if(s.exists&&s.data().pw===saved.h)return openRoom(saved.id,s.data().name)}catch(e){}}
}
async function enter(){
  const name=$("#rn").value.trim(),pw=$("#rp").value;
  if(!name||!pw){msg("Oda adı ve şifre gerekli");return}
  const id=slug(name),ref=db.doc("rooms/"+id);msg("");$("#go").disabled=true;
  try{
    const s=await ref.get();let d;
    if(s.exists){d=s.data();if(await sha(pw,d.salt)!==d.pw){msg("Şifre yanlış");return}}
    else{
      if(user&&user.canEdit&&user.canEdit()===false){msg("Bu oda yok; yeni oda sadece düzenleyiciler açabilir.");return}
      const salt=crypto.randomUUID();d={name,salt,pw:await sha(pw,salt),createdAt:Date.now()};await ref.set(d);
    }
    ls.set("album-room",JSON.stringify({id,h:d.pw}));openRoom(id,d.name);
  }catch(e){msg("Hata: "+(e.message||e.code))}finally{$("#go").disabled=false}
}
function openRoom(id,name){
  roomId=id;$("#gate").hidden=true;$("#app").hidden=false;$("#title").textContent=name;$("#dt").value=today();
  const canUp=!!assets&&!(user&&user.canEdit&&user.canEdit()===false);$("#up").hidden=!canUp;
  unsub=db.collection("rooms/"+id+"/photos").onSnapshot(s=>{photos=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{$("#count").textContent="Yüklenemedi: "+(e.message||e.code)});
}
function render(){
  photos.sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
  $("#count").textContent=photos.length+" fotoğraf";
  const list=$("#list");list.innerHTML="";
  if(!photos.length){const p=document.createElement("p");p.className="mu";p.textContent="Henüz fotoğraf yok. İlkini ekleyin 💕";list.append(p);return}
  const groups={};photos.forEach(p=>(groups[p.date]=groups[p.date]||[]).push(p));
  Object.keys(groups).forEach(dt=>{
    const h=document.createElement("h2");h.textContent=new Date(dt+"T12:00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric",weekday:"long"});
    const g=document.createElement("div");g.className="grid";
    groups[dt].forEach(p=>{const i=document.createElement("img");i.src=url(p);i.loading="lazy";i.alt=p.caption||"";i.onclick=()=>show(p);g.append(i)});
    list.append(h,g);
  });
}
function show(p){cur=p;$("#lbi").src=url(p);$("#lbc").textContent=p.caption||"";$("#lbd").value=p.date;const w=!$("#up").hidden;$("#lbd").hidden=$("#lbs").hidden=$("#lbx").hidden=!w;$("#lb").hidden=false}
async function shrink(f){
  try{const b=await createImageBitmap(f),k=Math.min(1,1800/Math.max(b.width,b.height)),c=document.createElement("canvas");
    c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",.85))||f}catch(e){return f}
}
async function upload(files){
  const date=$("#dt").value||today(),cap=$("#cp").value.trim();let n=0;
  for(const f of files){
    $("#st").textContent="Yükleniyor "+(++n)+"/"+files.length+"…";
    try{const r=await assets.upload(await shrink(f));
      await db.collection("rooms/"+roomId+"/photos").add({aid:r.id,date,caption:cap,createdAt:Date.now()})}
    catch(e){$("#st").textContent="Hata: "+(e.message||e.code);return}
  }
  $("#st").textContent="Eklendi ✓";$("#cp").value="";
}
$("#go").onclick=enter;
$("#rp").onkeydown=e=>{if(e.key==="Enter")enter()};
$("#pick").onclick=()=>$("#fi").click();
$("#fi").onchange=e=>{if(e.target.files.length)upload([...e.target.files]);e.target.value=""};
$("#lbk").onclick=()=>$("#lb").hidden=true;
$("#lbs").onclick=async()=>{try{await db.doc("rooms/"+roomId+"/photos/"+cur.id).update({date:$("#lbd").value||cur.date});$("#lb").hidden=true}catch(e){alert(e.message||e.code)}};
$("#lbx").onclick=async()=>{if(!confirm("Bu fotoğraf silinsin mi?"))return;try{await db.doc("rooms/"+roomId+"/photos/"+cur.id).delete();try{await assets.delete(cur.aid)}catch(e){}$("#lb").hidden=true}catch(e){alert(e.message||e.code)}};
$("#out").onclick=()=>{if(unsub)unsub();ls.del("album-room");$("#app").hidden=true;$("#gate").hidden=false;$("#rp").value=""};
init();
</script>
</body>
</html>
