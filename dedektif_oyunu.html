<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROMETHEUS // Dedektif İstasyonu v2.1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap');

:root {
  --bg-primary: #080c10;
  --bg-secondary: #0d1117;
  --bg-panel: #0a0f15;
  --bg-card: #0f1520;
  --accent-primary: #00d4ff;
  --accent-secondary: #ff3366;
  --accent-warn: #ffaa00;
  --accent-green: #00ff88;
  --text-primary: #c8d8e8;
  --text-secondary: #6a8090;
  --text-dim: #3a4a55;
  --border-color: #1a2535;
  --border-accent: #1e3a4a;
  --glow-blue: 0 0 20px rgba(0,212,255,0.3);
  --glow-red: 0 0 20px rgba(255,51,102,0.3);
  --glow-green: 0 0 20px rgba(0,255,136,0.2);
  --scanline: rgba(0,212,255,0.03);
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  overflow:hidden;
  background: var(--bg-primary);
  font-family: 'Share Tech Mono', monospace;
  color: var(--text-primary);
  cursor: crosshair;
}

/* CRT effect overlay */
body::before {
  content:'';
  position:fixed; inset:0; z-index:9999;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    var(--scanline) 2px,
    var(--scanline) 4px
  );
  pointer-events:none;
  animation: scanMove 8s linear infinite;
}
body::after {
  content:'';
  position:fixed; inset:0; z-index:9998;
  background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
  pointer-events:none;
}

@keyframes scanMove {
  0%{background-position:0 0}
  100%{background-position:0 100px}
}

/* Glitch animation */
@keyframes glitch1 {
  0%,90%,100%{transform:translateX(0) skew(0)}
  91%{transform:translateX(-3px) skew(-1deg)}
  93%{transform:translateX(3px) skew(1deg)}
  95%{transform:translateX(-1px)}
  97%{transform:translateX(2px)}
}
@keyframes glitch2 {
  0%,85%,100%{clip-path:none;transform:translateX(0)}
  86%{clip-path:polygon(0 20%,100% 20%,100% 30%,0 30%);transform:translateX(4px)}
  88%{clip-path:polygon(0 60%,100% 60%,100% 70%,0 70%);transform:translateX(-4px)}
  90%{clip-path:none;transform:translateX(0)}
}
@keyframes pulse {
  0%,100%{opacity:1} 50%{opacity:0.5}
}
@keyframes blink {
  0%,100%{opacity:1} 49%{opacity:1} 50%{opacity:0}
}
@keyframes fadeIn {
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes slideLeft {
  from{opacity:0;transform:translateX(20px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes typewriter {
  from{width:0} to{width:100%}
}
@keyframes flicker {
  0%,100%{opacity:1}
  92%{opacity:1}
  93%{opacity:0.3}
  94%{opacity:1}
  96%{opacity:0.7}
  97%{opacity:1}
}

/* Boot screen */
#bootScreen {
  position:fixed; inset:0; z-index:10000;
  background:#000;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  font-family:'Share Tech Mono',monospace;
  transition: opacity 0.8s;
}
#bootScreen.hidden { opacity:0; pointer-events:none; }
.boot-logo {
  font-family:'Orbitron',monospace;
  font-size:3rem; font-weight:900;
  color: var(--accent-primary);
  text-shadow: var(--glow-blue);
  letter-spacing:0.3em;
  animation: flicker 4s infinite;
  margin-bottom:2rem;
}
.boot-sub {
  color: var(--text-secondary);
  font-size:0.85rem;
  letter-spacing:0.2em;
  margin-bottom:3rem;
}
.boot-log {
  width:500px; max-width:90vw;
  font-size:0.75rem;
  color: #3a8a6a;
  line-height:1.8;
}
.boot-log .ok { color: var(--accent-green); }
.boot-log .warn { color: var(--accent-warn); }
.boot-log .err { color: var(--accent-secondary); }
.boot-progress {
  width:500px; max-width:90vw;
  height:3px;
  background: #111;
  border:1px solid #1a3a2a;
  margin-top:1.5rem;
  overflow:hidden;
}
.boot-bar {
  height:100%;
  background: linear-gradient(90deg, var(--accent-green), var(--accent-primary));
  width:0%;
  transition: width 0.1s;
  box-shadow: 0 0 10px var(--accent-primary);
}

/* Main app */
#app {
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  opacity:0; transition: opacity 0.8s;
}
#app.visible { opacity:1; }

/* Top bar */
#topbar {
  height:38px;
  background: linear-gradient(180deg, #0c1520 0%, #080e18 100%);
  border-bottom:1px solid var(--border-accent);
  display:flex; align-items:center;
  padding:0 16px;
  flex-shrink:0;
  position:relative;
  z-index:100;
}
.tb-logo {
  font-family:'Orbitron',monospace;
  font-size:0.7rem; font-weight:700;
  color: var(--accent-primary);
  letter-spacing:0.15em;
  margin-right:24px;
  text-shadow: var(--glow-blue);
  animation: glitch1 6s infinite;
}
.tb-sep { color: var(--text-dim); margin:0 8px; }
.tb-status {
  font-size:0.65rem;
  color: var(--text-secondary);
  letter-spacing:0.1em;
}
.tb-status .dot {
  display:inline-block; width:6px; height:6px;
  border-radius:50%; margin-right:5px;
  background: var(--accent-green);
  box-shadow: var(--glow-green);
  animation: pulse 2s infinite;
}
.tb-right {
  margin-left:auto;
  display:flex; align-items:center; gap:20px;
}
.tb-time {
  font-size:0.7rem;
  color: var(--accent-primary);
  letter-spacing:0.1em;
  font-family:'Orbitron',monospace;
}
.tb-alert {
  font-size:0.65rem;
  color: var(--accent-secondary);
  padding:2px 8px;
  border:1px solid var(--accent-secondary);
  border-radius:2px;
  animation: pulse 1.5s infinite;
  cursor:pointer;
}
.tb-case {
  font-size:0.65rem;
  color: var(--accent-warn);
  letter-spacing:0.08em;
}

/* Main layout */
#main {
  flex:1;
  display:flex;
  overflow:hidden;
}

/* Left sidebar - file system */
#sidebar {
  width:220px;
  background: var(--bg-panel);
  border-right:1px solid var(--border-color);
  display:flex; flex-direction:column;
  overflow:hidden;
  flex-shrink:0;
}
.sidebar-header {
  padding:10px 14px;
  font-size:0.65rem;
  color: var(--text-secondary);
  letter-spacing:0.15em;
  border-bottom:1px solid var(--border-color);
  display:flex; align-items:center; gap:8px;
}
.sidebar-header::before {
  content:'';
  width:4px; height:4px;
  background: var(--accent-primary);
  border-radius:50%;
  flex-shrink:0;
}
#fileTree {
  flex:1; overflow-y:auto; padding:8px 0;
}
#fileTree::-webkit-scrollbar { width:4px; }
#fileTree::-webkit-scrollbar-track { background:transparent; }
#fileTree::-webkit-scrollbar-thumb { background: var(--border-accent); }

.folder {
  user-select:none;
}
.folder-label {
  padding:5px 14px;
  font-size:0.7rem;
  color: var(--text-secondary);
  letter-spacing:0.08em;
  cursor:pointer;
  display:flex; align-items:center; gap:6px;
  transition:all 0.15s;
}
.folder-label:hover { color: var(--accent-primary); background:rgba(0,212,255,0.04); }
.folder-label .icon { font-size:0.65rem; transition:transform 0.2s; }
.folder-label.open .icon { transform:rotate(90deg); }
.folder-label .badge {
  margin-left:auto;
  font-size:0.55rem;
  padding:1px 5px;
  background: rgba(255,51,102,0.2);
  color: var(--accent-secondary);
  border-radius:8px;
}
.folder-children { display:none; }
.folder-children.visible { display:block; }

.file-item {
  padding:4px 14px 4px 28px;
  font-size:0.68rem;
  color: var(--text-secondary);
  cursor:pointer;
  display:flex; align-items:center; gap:7px;
  transition:all 0.15s;
  border-left:2px solid transparent;
  margin:1px 0;
}
.file-item:hover {
  color: var(--text-primary);
  background: rgba(0,212,255,0.06);
  border-left-color: var(--accent-primary);
}
.file-item.active {
  color: var(--accent-primary);
  background: rgba(0,212,255,0.1);
  border-left-color: var(--accent-primary);
}
.file-item.locked { color: var(--accent-secondary); }
.file-item.locked:hover { color: var(--accent-secondary); border-left-color:var(--accent-secondary); }
.file-item.new-found { animation: pulse 2s 3; }
.file-item .file-icon { font-size:0.65rem; }

/* Center - content viewer */
#viewer {
  flex:1;
  display:flex; flex-direction:column;
  overflow:hidden;
  background: var(--bg-secondary);
}
.viewer-tabs {
  display:flex; align-items:center;
  background: var(--bg-panel);
  border-bottom:1px solid var(--border-color);
  padding:0 12px;
  gap:2px;
  flex-shrink:0;
  overflow-x:auto;
}
.viewer-tabs::-webkit-scrollbar { height:3px; }
.viewer-tabs::-webkit-scrollbar-thumb { background:var(--border-accent); }
.vtab {
  padding:8px 14px;
  font-size:0.65rem;
  color: var(--text-dim);
  cursor:pointer;
  border-bottom:2px solid transparent;
  white-space:nowrap;
  transition:all 0.15s;
  letter-spacing:0.05em;
}
.vtab:hover { color:var(--text-secondary); }
.vtab.active {
  color: var(--accent-primary);
  border-bottom-color: var(--accent-primary);
}
#viewerContent {
  flex:1; overflow-y:auto; padding:20px;
}
#viewerContent::-webkit-scrollbar { width:5px; }
#viewerContent::-webkit-scrollbar-thumb { background:var(--border-accent); }

/* Right panel - evidence board */
#rightPanel {
  width:260px;
  background: var(--bg-panel);
  border-left:1px solid var(--border-color);
  display:flex; flex-direction:column;
  overflow:hidden;
  flex-shrink:0;
}
.rp-section {
  padding:10px 14px;
  font-size:0.65rem;
  color: var(--text-secondary);
  letter-spacing:0.15em;
  border-bottom:1px solid var(--border-color);
  display:flex; align-items:center; gap:8px;
}
.rp-section::before {
  content:'';
  width:4px; height:4px;
  background: var(--accent-secondary);
  border-radius:50%;
}
#evidenceBoard {
  flex:1; overflow-y:auto; padding:10px;
}
#evidenceBoard::-webkit-scrollbar { width:4px; }
#evidenceBoard::-webkit-scrollbar-thumb { background:var(--border-accent); }

.evidence-item {
  background: var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:4px;
  padding:10px 12px;
  margin-bottom:8px;
  cursor:pointer;
  transition:all 0.2s;
  animation: fadeIn 0.3s ease;
}
.evidence-item:hover {
  border-color: var(--accent-primary);
  background: rgba(0,212,255,0.05);
  transform:translateX(-2px);
}
.evidence-item.critical {
  border-color: var(--accent-secondary);
  background: rgba(255,51,102,0.05);
}
.ev-tag {
  font-size:0.55rem;
  color: var(--accent-primary);
  letter-spacing:0.1em;
  margin-bottom:4px;
}
.evidence-item.critical .ev-tag { color:var(--accent-secondary); }
.ev-title {
  font-size:0.7rem;
  color: var(--text-primary);
  font-family:'Rajdhani',sans-serif;
  font-weight:600;
  margin-bottom:3px;
}
.ev-note {
  font-size:0.62rem;
  color: var(--text-secondary);
  line-height:1.5;
}

/* Notes section */
#notesSection {
  border-top:1px solid var(--border-color);
  padding:10px;
  flex-shrink:0;
}
.notes-label {
  font-size:0.6rem;
  color: var(--text-secondary);
  letter-spacing:0.12em;
  margin-bottom:6px;
}
#notesArea {
  width:100%;
  height:80px;
  background: var(--bg-card);
  border:1px solid var(--border-color);
  color: var(--text-primary);
  font-family:'Share Tech Mono',monospace;
  font-size:0.65rem;
  padding:7px;
  resize:none;
  outline:none;
  border-radius:3px;
  line-height:1.5;
}
#notesArea:focus { border-color:var(--accent-primary); }

/* Accusation button */
#accuseBtn {
  margin:8px 10px;
  padding:10px;
  background: rgba(255,51,102,0.1);
  border:1px solid var(--accent-secondary);
  color: var(--accent-secondary);
  font-family:'Orbitron',monospace;
  font-size:0.65rem;
  font-weight:700;
  letter-spacing:0.15em;
  cursor:pointer;
  border-radius:3px;
  width:calc(100% - 20px);
  transition:all 0.2s;
}
#accuseBtn:hover {
  background: rgba(255,51,102,0.2);
  box-shadow: var(--glow-red);
}

/* Document styles */
.doc-container {
  animation: fadeIn 0.4s ease;
  max-width:680px;
  margin:0 auto;
}
.doc-header {
  border-bottom:2px solid var(--border-accent);
  padding-bottom:16px;
  margin-bottom:20px;
}
.doc-agency {
  font-family:'Orbitron',monospace;
  font-size:0.65rem;
  color: var(--accent-primary);
  letter-spacing:0.2em;
  margin-bottom:6px;
}
.doc-title {
  font-family:'Rajdhani',sans-serif;
  font-size:1.6rem;
  font-weight:700;
  color: var(--text-primary);
  margin-bottom:8px;
  line-height:1.2;
}
.doc-meta {
  display:flex; gap:20px; flex-wrap:wrap;
}
.doc-meta span {
  font-size:0.65rem;
  color: var(--text-secondary);
}
.doc-meta span strong {
  color: var(--accent-primary);
}
.doc-body {
  font-size:0.78rem;
  line-height:1.8;
  color: var(--text-primary);
}
.doc-body p { margin-bottom:12px; }
.doc-body h3 {
  font-family:'Rajdhani',sans-serif;
  font-size:1rem;
  color: var(--accent-primary);
  margin:20px 0 8px;
  letter-spacing:0.08em;
  border-left:3px solid var(--accent-primary);
  padding-left:10px;
}
.doc-body .highlight {
  background: rgba(255,170,0,0.1);
  border:1px solid rgba(255,170,0,0.3);
  padding:2px 6px;
  border-radius:2px;
  color: var(--accent-warn);
}
.doc-body .redacted {
  background: var(--text-primary);
  color: var(--text-primary);
  padding:0 4px;
  user-select:none;
}
.doc-body table {
  width:100%;
  border-collapse:collapse;
  margin:12px 0;
  font-size:0.72rem;
}
.doc-body th {
  padding:7px 10px;
  background: rgba(0,212,255,0.1);
  color: var(--accent-primary);
  text-align:left;
  border:1px solid var(--border-accent);
  letter-spacing:0.06em;
}
.doc-body td {
  padding:6px 10px;
  border:1px solid var(--border-color);
  color: var(--text-secondary);
}
.doc-body tr:hover td { color:var(--text-primary); background:rgba(255,255,255,0.02); }

/* Suspect profile */
.suspect-grid {
  display:grid; grid-template-columns:160px 1fr;
  gap:20px; margin-bottom:20px;
}
.suspect-photo {
  width:160px; height:200px;
  background: var(--bg-card);
  border:2px solid var(--border-accent);
  display:flex; align-items:center; justify-content:center;
  position:relative;
  overflow:hidden;
}
.suspect-photo .photo-placeholder {
  font-size:4rem;
  filter:grayscale(0.5);
}
.suspect-photo .photo-overlay {
  position:absolute; inset:0;
  background: repeating-linear-gradient(
    45deg, transparent, transparent 3px,
    rgba(0,212,255,0.03) 3px, rgba(0,212,255,0.03) 4px
  );
}
.suspect-photo .photo-tag {
  position:absolute; bottom:0; left:0; right:0;
  background:rgba(0,0,0,0.8);
  padding:4px 8px;
  font-size:0.6rem;
  color: var(--accent-primary);
  letter-spacing:0.1em;
}
.suspect-stats {
  display:grid; grid-template-columns:1fr 1fr;
  gap:8px; height:fit-content;
}
.stat-item {
  background: var(--bg-card);
  border:1px solid var(--border-color);
  padding:8px 12px;
  border-radius:3px;
}
.stat-label {
  font-size:0.58rem;
  color: var(--text-dim);
  letter-spacing:0.1em;
  margin-bottom:3px;
}
.stat-value {
  font-size:0.75rem;
  color: var(--text-primary);
  font-family:'Rajdhani',sans-serif;
  font-weight:600;
}
.stat-value.danger { color:var(--accent-secondary); }
.stat-value.warn { color:var(--accent-warn); }
.stat-value.ok { color:var(--accent-green); }

/* Camera viewer */
.cam-container {
  animation: fadeIn 0.4s ease;
}
.cam-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px;
}
.cam-title {
  font-family:'Rajdhani',sans-serif;
  font-size:1.2rem; font-weight:700;
  color: var(--text-primary);
}
.cam-status {
  font-size:0.65rem;
  color: var(--accent-secondary);
  animation: pulse 1s infinite;
}
.cam-screen {
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border:2px solid var(--border-accent);
  position:relative;
  overflow:hidden;
  cursor:zoom-in;
}
.cam-screen .cam-scene {
  width:100%; height:100%;
  font-size:5rem;
  display:flex; align-items:center; justify-content:center;
  background: linear-gradient(135deg, #050a0f 0%, #0a1520 50%, #050a10 100%);
  filter: contrast(1.2) brightness(0.8);
  animation: flicker 5s infinite;
}
.cam-overlay {
  position:absolute; inset:0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 4px,
    rgba(0,30,10,0.2) 4px, rgba(0,30,10,0.2) 5px
  );
  mix-blend-mode: overlay;
}
.cam-info {
  position:absolute; top:8px; left:8px;
  font-size:0.65rem; color:#0f8;
  text-shadow:0 0 6px #0f8;
  line-height:1.6;
}
.cam-ts {
  position:absolute; bottom:8px; right:8px;
  font-size:0.7rem; color:#0f8;
  text-shadow:0 0 6px #0f8;
  animation: blink 1s step-end infinite;
}
.cam-corner {
  position:absolute;
  width:15px; height:15px;
  border-color:#0f8;
  border-style:solid;
}
.cam-corner.tl { top:6px;left:6px; border-width:2px 0 0 2px; }
.cam-corner.tr { top:6px;right:6px; border-width:2px 2px 0 0; }
.cam-corner.bl { bottom:6px;left:6px; border-width:0 0 2px 2px; }
.cam-corner.br { bottom:6px;right:6px; border-width:0 2px 2px 0; }

.cam-events {
  margin-top:12px;
}
.cam-events-label {
  font-size:0.62rem;
  color: var(--text-secondary);
  letter-spacing:0.12em;
  margin-bottom:8px;
}
.cam-event-item {
  display:flex; align-items:flex-start; gap:10px;
  padding:8px;
  border:1px solid var(--border-color);
  border-radius:3px;
  margin-bottom:6px;
  cursor:pointer;
  transition:all 0.2s;
}
.cam-event-item:hover {
  border-color:var(--accent-primary);
  background:rgba(0,212,255,0.04);
}
.cam-event-time {
  font-size:0.68rem;
  color: var(--accent-primary);
  white-space:nowrap;
  width:55px;
}
.cam-event-desc {
  font-size:0.68rem;
  color: var(--text-secondary);
  line-height:1.4;
}
.cam-event-item.critical .cam-event-time { color:var(--accent-secondary); }
.cam-event-item.critical .cam-event-desc { color:var(--text-primary); }

/* Phone log */
.phone-log {
  font-size:0.72rem;
}
.phone-entry {
  display:flex;
  border-bottom:1px solid var(--border-color);
  padding:8px 6px;
  gap:12px;
  transition:background 0.15s;
}
.phone-entry:hover { background:rgba(255,255,255,0.02); }
.phone-entry .pe-time { color:var(--accent-primary); width:70px; flex-shrink:0; }
.phone-entry .pe-from { color:var(--text-secondary); width:120px; flex-shrink:0; }
.phone-entry .pe-to { color:var(--text-secondary); width:120px; flex-shrink:0; }
.phone-entry .pe-dur { color:var(--accent-green); width:60px; flex-shrink:0; }
.phone-entry .pe-flag { color:var(--accent-secondary); }

/* Password screen */
.pw-screen {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding:60px 20px;
  animation: fadeIn 0.4s ease;
}
.pw-icon { font-size:3rem; margin-bottom:16px; }
.pw-title {
  font-family:'Orbitron',monospace;
  font-size:1rem; font-weight:700;
  color: var(--accent-secondary);
  letter-spacing:0.2em;
  margin-bottom:8px;
}
.pw-sub {
  font-size:0.7rem;
  color: var(--text-secondary);
  margin-bottom:24px;
  text-align:center;
}
.pw-input-wrap {

  <div class="pw-input-wrap">
    <input class="pw-input" id="pwInput_${fileId}" type="text" placeholder="ŞİFRE" maxlength="20"
      onkeydown="if(event.key==='Enter') checkPw('${fileId}','${unlockedId}')">
    <button class="pw-btn" onclick="checkPw('${fileId}','${unlockedId}')">GİR</button>

</div>`;
}

function renderCamera(name, id, ts, emoji, events, fileId) {
  const evHtml = events.map(e => `
    <div class="cam-event-item ${e.critical?'critical':''}">
      <span class="cam-event-time">${e.time}</span>
      <span class="cam-event-desc">${e.desc}</span>
    </div>`).join('');

  const critCount = events.filter(e=>e.critical).length;
  return `
<div class="cam-container">
  <div class="cam-header">
    <div class="cam-title">${name}</div>
    <div class="cam-status">● KAYITTAN OYNATILIYOR</div>
  </div>
  <div class="cam-screen" onclick="this.querySelector('.cam-scene').style.transform=this.querySelector('.cam-scene').style.transform?'':'scale(1.8)'">
    <div class="cam-scene">${emoji}</div>
    <div class="cam-overlay"></div>
    <div class="cam-info">${id}<br>${name}</div>
    <div class="cam-ts">${ts} ●REC</div>
    <div class="cam-corner tl"></div><div class="cam-corner tr"></div>
    <div class="cam-corner bl"></div><div class="cam-corner br"></div>
  </div>
  <div class="cam-events">
    <div class="cam-events-label">// KAYIT OLAYları (${events.length} kayıt, ${critCount} kritik)</div>
    ${evHtml}
  </div>
  ${critCount > 0 ? `<button class="add-evidence-btn" onclick="addEvidence('Kamera ${id}: Kritik hareket tespit edildi — ${events.filter(e=>e.critical)[0].desc.substring(0,60)}...','${fileId}')" id="ev_${fileId}">+ Delili Panoya Ekle</button>` : ''}
</div>`;
}

function renderPhoto(title, emoji, annotations, fileId) {
  const annHtml = annotations.map(a =>
    `<div class="annotation"><span class="ann-num">[${a.num}]</span>${a.text}</div>`
  ).join('');
  return `
<div class="photo-viewer">
  <div class="doc-header" style="border-bottom:1px solid var(--border-accent);padding-bottom:12px;margin-bottom:16px;">
    <div class="doc-agency">ADLİ FOTOĞRAF ANALİZİ</div>
    <div class="doc-title" style="font-size:1.2rem;">${title}</div>
  </div>
  <div class="photo-frame" onclick="this.classList.toggle('zoomed');this.style.transform=this.style.transform?'':'scale(1.4)'">
    ${emoji}
    <div class="photo-overlay-scan"></div>
  </div>
  <div class="photo-annotations" style="margin-top:12px;">${annHtml}</div>
  <button class="add-evidence-btn" onclick="addEvidence('Fotoğraf: ${title.substring(0,50)}','${fileId}')" id="ev_${fileId}">
    + Delili Panoya Ekle
  </button>
</div>`;
}

function renderAudio(title, meta, transcript, fileId) {
  const bars = Array.from({length:40}, (_,i) =>
    `<div class="ap-bar" style="height:${8+Math.sin(i*0.8)*8+Math.random()*8}px"></div>`
  ).join('');

<div class="doc-container">
  <div class="doc-header">
    <div class="doc-agency">SES KAYDI ANALİZİ</div>
    <div class="doc-title" style="font-size:1.2rem;">${title}</div>
    <div class="doc-meta"><span>${meta}</span></div>
  </div>
  <div class="audio-player">
    <div class="ap-title">// SES DOSYASI</div>
    <div class="ap-controls">
      <div class="ap-play" onclick="playAudio(this)">▶</div>
      <div class="ap-waveform">${bars}</div>
      <div class="ap-time">47:23</div>
    </div>
    <div class="ap-transcript">${transcript.split('\n').join('<br>')}</div>
  </div>
  <button class="add-evidence-btn" onclick="addEvidence('Ses Kaydı: ${title.substring(0,50)} — transkript analiz edildi','${fileId}')" id="ev_${fileId}">
    + Delili Panoya Ekle
  </button>
</div>`;
}

// ============================================================
// FILE TREE BUILDER
// ============================================================
function buildFileTree() {
  const tree = document.getElementById('fileTree');
  tree.innerHTML = '';

  FILE_SYSTEM.forEach(folder => {
    const div = document.createElement('div');
    div.className = 'folder';

    const visibleChildren = folder.children.filter(c => !c.hidden || GAME.unlockedFiles.has(c.id));

    div.innerHTML = `
      <div class="folder-label" onclick="toggleFolder(this)">
        <span class="icon">▶</span>
        <span>${folder.label}</span>
        ${folder.badge ? `<span class="badge">${folder.badge}</span>` : ''}
      </div>
      <div class="folder-children">
        ${visibleChildren.map(f => `
          <div class="file-item ${f.locked && !GAME.solvedPasswords.has(f.id) ? 'locked':''}"
            id="fi_${f.id}"
            onclick="openFile('${f.id}')">
            <span class="file-icon">${f.icon}</span>
            <span>${f.label}</span>
          </div>
        `).join('')}
      </div>`;
    tree.appendChild(div);
  });
}

function toggleFolder(el) {
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('visible');
}

// ============================================================
// FILE OPENER
// ============================================================
function openFile(id) {
  if (!GAME.gameStarted && id !== 'welcome') {
    showToast('Önce soruşturmayı başlatmalısın.','warn');
    return;
  }

  const actualId = GAME.solvedPasswords.has(id) ? id + '_content' : id;

  if (!GAME.openTabs.includes(id)) {
    GAME.openTabs.push(id);
    const tabs = document.getElementById('viewerTabs');
    const tab = document.createElement('div');
    tab.className = 'vtab';
    tab.dataset.id = id;
    tab.textContent = getTabLabel(id);
    tab.onclick = () => switchTab(id);
    const closeBtn = document.createElement('span');
    closeBtn.textContent = ' ×';
    closeBtn.style.cssText = 'margin-left:6px;opacity:0.5;';
    closeBtn.onclick = (e) => { e.stopPropagation(); closeTab(id); };
    tab.appendChild(closeBtn);
    tabs.appendChild(tab);
  }
  switchTab(id);
  setActiveFile(id);
}

function getTabLabel(id) {
  const labels = {
    welcome:'Anasayfa', olay_raporu:'Olay Raporu', otopsi:'Otopsi', lab_raporu:'Lab',
    lab_encrypted:'Şifreli Lab', timeline:'Zaman Çizelgesi',
    leyla:'Leyla K.', murat:'Murat Y.', sinem:'Sinem D.', tarkan:'Tarkan A.',
    cam_giris:'CAM-01', cam_asansor:'CAM-02', cam_otopark:'CAM-03',
    cam_mutfak:'CAM-04', cam_cikis:'CAM-05',
    phone_leyla:'GSM-Leyla', phone_murat:'GSM-Murat', phone_sinem:'GSM-Sinem',
    photo_olay:'Foto-01', photo_parmak:'Foto-02', photo_kesik:'Foto-03', photo_ayiz:'Foto-04',
    leyla_private:'Leyla-Özel', ali_private:'Ali-Özel', zoraki_itiraf:'İtiraf',
    audio_sorgu_leyla:'Ses-Leyla', audio_sorgu_murat:'Ses-Murat',
    audio_sorgu_tarkan:'Ses-Tarkan', audio_telefon:'Ses-Telefon',
  };
  return labels[id] || id;
}

function switchTab(id) {
  GAME.activeTab = id;
  document.querySelectorAll('.vtab').forEach(t => t.classList.toggle('active', t.dataset.id === id));
  renderContent(id);
}

function closeTab(id) {
  const idx = GAME.openTabs.indexOf(id);
  if (idx !== -1) GAME.openTabs.splice(idx, 1);
  document.querySelector(`.vtab[data-id="${id}"]`)?.remove();
  if (GAME.activeTab === id) {
    const newId = GAME.openTabs[GAME.openTabs.length - 1] || 'welcome';
    GAME.openTabs.includes('welcome') || GAME.openTabs.push('welcome');
    switchTab(newId);
  }
}

function setActiveFile(id) {
  document.querySelectorAll('.file-item').forEach(el => {
    el.classList.toggle('active', el.id === 'fi_' + id);
  });
}

function renderContent(id) {
  const vc = document.getElementById('viewerContent');
  const renderer = CONTENT[id] || CONTENT[id + '_content'];
  if (renderer) {
    vc.innerHTML = renderer();
    // restore disabled state for already-added evidence
    GAME.collectedEvidence.forEach(ev => {
      if (ev.source === id) {
        const btn = document.getElementById('ev_' + id) || document.getElementById('ev_' + ev.btnId);
        if (btn) btn.disabled = true;
      }
    });
  } else {
    vc.innerHTML = `<div style="padding:40px;color:var(--text-dim);font-size:0.8rem;">Dosya yüklenemedi: ${id}</div>`;
  }
}

// ============================================================
// PASSWORD
// ============================================================
function checkPw(fileId, unlockedId) {
  const inp = document.getElementById('pwInput_' + fileId);
  const errEl = document.getElementById('pwErr_' + fileId);
  const val = inp.value.trim().toUpperCase();
  const correct = GAME.passwords[fileId].toUpperCase();
  if (val === correct) {
    GAME.solvedPasswords.add(fileId);
    showToast('Şifre doğru! Dosya açıldı.','ok');
    if (fileId === 'lab_encrypted') {
      unlockHiddenFile('zoraki_itiraf');
    }
    renderContent(fileId);
    buildFileTree();
  } else {
    errEl.style.display = 'block';
    errEl.style.animation = 'none';
    setTimeout(() => errEl.style.animation = '', 10);
    inp.value = '';
    inp.focus();
  }
}

function unlockHiddenFile(id) {
  GAME.unlockedFiles.add(id);
  buildFileTree();
  showToast('Gizli dosya açıldı: ' + id, 'warn');
}

// ============================================================
// EVIDENCE
// ============================================================
function addEvidence(note, source, critical=false) {
  if (GAME.collectedEvidence.find(e => e.source === source)) {
    showToast('Bu delil zaten eklendi.','warn');
    return;
  }
  GAME.collectedEvidence.push({note, source, critical});
  const board = document.getElementById('evidenceBoard');
  const el = document.createElement('div');
  el.className = 'evidence-item' + (critical ? ' critical' : '');
  el.innerHTML = `
    <div class="ev-tag">${critical ? '⚠ KRİTİK' : '◉ DELİL'} — ${GAME.collectedEvidence.length.toString().padStart(2,'0')}</div>
    <div class="ev-title">${source.toUpperCase()}</div>
    <div class="ev-note">${note}</div>`;
  board.appendChild(el);

  const btn = document.getElementById('ev_' + source);
  if (btn) btn.disabled = true;

  showToast(critical ? '⚠ Kritik delil eklendi!' : 'Delil panoya eklendi!', critical ? 'err' : 'ok');
}

// ============================================================
// ACCUSATION
// ============================================================
function openAccuse() {
  if (GAME.collectedEvidence.length < 3) {
    showToast('Yeterli delil yok! En az 3 delil toplamalısın.','warn');
    return;
  }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">⚖ SUÇLAMA YAP</div>
      <div class="modal-sub">Hangi şüpheliyi Kemal Yıldız'ı öldürmekle suçluyorsun?</div>
      <div class="suspect-choices">
        ${[
          {id:'leyla', emoji:'👩', name:'Leyla Karahan', role:'Komşu / Eski Öğrenci'},
          {id:'murat', emoji:'👨', name:'Murat Yılmaz', role:'Apartman Görevlisi'},
          {id:'sinem', emoji:'👩‍💼', name:'Sinem Doğan', role:'Komşu / Avukat'},
          {id:'tarkan', emoji:'👮', name:'Tarkan Arslan', role:'Güvenlik Görevlisi'},
        ].map(s => `
          <div class="suspect-choice" onclick="selectSuspect('${s.id}', this)">
            <span class="sc-photo">${s.emoji}</span>
            <div><div class="sc-name">${s.name}</div><div class="sc-role">${s.role}</div></div>
          </div>`).join('')}

      <div class="modal-btns">
        <button class="modal-btn cancel" onclick="this.closest('.modal-overlay').remove()">İPTAL</button>
        <button class="modal-btn confirm" id="confirmAccuse" onclick="makeAccusation()">SUÇLA</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  GAME.selectedSuspect = null;
}

function selectSuspect(id, el) {
  document.querySelectorAll('.suspect-choice').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  GAME.selectedSuspect = id;
}

function makeAccusation() {
  if (!GAME.selectedSuspect) {
    showToast('Bir şüpheli seçmelisin!', 'warn');
    return;
  }
  document.querySelector('.modal-overlay')?.remove();
  showEnding(GAME.selectedSuspect === GAME.killer);
}

// ============================================================
// UI HELPERS
// ============================================================
function showToast(msg, type='ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<div class="toast-title">${type==='err'?'⚠ KRİTİK':type==='warn'?'! UYARI':'✓ BİLGİ'}</div>${msg}`;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity 0.5s'; setTimeout(()=>t.remove(),500); }, 3000);
}

function showAlert() {
  showToast('Bu sistem İstanbul Emniyet Müdürlüğü tarafından yetkili personele tahsis edilmiştir. Tüm erişimler kaydedilmektedir.','warn');
}

function playAudio(btn) {
  btn.textContent = btn.textContent === '▶' ? '⏸' : '▶';
}

function startGame() {
  GAME.gameStarted = true;
  // unlock all non-hidden, non-locked files
  FILE_SYSTEM.forEach(f => f.children.forEach(c => {
    if (!c.hidden) GAME.unlockedFiles.add(c.id);
  }));
  openFile('olay_raporu');
  showToast('Soruşturma başladı. İyi şanslar, Dedektif.','ok');
}

// ============================================================
// CLOCK
// ============================================================
function updateClock() {
  const now = new Date();
  document.getElementById('clockDisplay').textContent =
    now.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

  {msg:'PROMETHEUS v2.1.4 yükleniyor...', cls:''},
  {msg:'[OK] Kernel bileşenleri başlatılıyor', cls:'ok'},
  {msg:'[OK] Ağ arayüzü eth0 etkin', cls:'ok'},
  {msg:'[OK] Şifrelenmiş disk bağlandı /dev/sda1', cls:'ok'},
  {msg:'[WARN] 3 şifreli dosya tespit edildi', cls:'warn'},
  {msg:'[OK] Adli analiz modülü aktif', cls:'ok'},
  {msg:'[OK] DNA veritabanı bağlantısı kuruldu', cls:'ok'},
  {msg:'[OK] GSM kayıt sistemi başlatıldı', cls:'ok'},
  {msg:'[WARN] Güvenlik seviyesi YÜKSEK — yetkili personel', cls:'warn'},
  {msg:'[OK] Kamera kayıtları 5/5 yüklendi', cls:'ok'},
  {msg:'[OK] Dava CIN-2024-0118 aktif hâle getirildi', cls:'ok'},
  {msg:'[SYS] PROMETHEUS hazır.', cls:'ok'},
];

function runBoot() {
  const logEl = document.getElementById('bootLog');
  const barEl = document.getElementById('bootBar');
  let i = 0;
  const interval = setInterval(() => {
    if (i < BOOT_MESSAGES.length) {
      const m = BOOT_MESSAGES[i];
      const line = document.createElement('div');
      line.textContent = m.msg;
      if (m.cls) line.className = m.cls;
      logEl.appendChild(line);
      barEl.style.width = ((i+1)/BOOT_MESSAGES.length * 100) + '%';
      i++;
    } else {
      clearInterval(interval);
      setTimeout(() => {
        document.getElementById('bootScreen').classList.add('hidden');
        document.getElementById('app').classList.add('visible');
        buildFileTree();
        renderContent('welcome');
      }, 600);
    }
  }, 200);
}

runBoot();
